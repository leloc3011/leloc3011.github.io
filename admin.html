<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StayEasy Admin - Quản Lý Đặt Phòng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="admin-style.css">
</head>
<body class="bg-light py-5">
<div class="container">
    <div class="card shadow-sm border-0 p-4">
        <h1 class="text-primary fw-bold mb-4 border-bottom pb-2">Hệ thống xử lý yêu cầu đặt phòng</h1>
        <div class="table-responsive rounded-3">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" class="ps-3">Thông tin khách hàng</th>
                        <th scope="col">Tên phòng</th>
                        <th scope="col">Số đêm</th>
                        <th scope="col">Tổng tiền</th>
                        <th scope="col">Trạng thái</th>
                        <th scope="col" class="pe-3 text-end">Hành động</th>
                    </tr>
                </thead>
                <tbody id="bookingTable"></tbody>
            </table>
        </div>
    </div>
</div>
<script src="admin.js"></script>
</body>
</html>
